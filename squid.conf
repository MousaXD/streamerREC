# Public-web egress: no private destinations or arbitrary ports.
http_port 3128
visible_hostname streamrec-egress
pid_filename none
cache deny all
cache_mem 8 MB
cache_store_log none
logfile_rotate 0
logformat egress %ts %rm %>rd %Ss/%>Hs
access_log stdio:/dev/stdout egress
cache_log /dev/stderr
strip_query_terms on
forwarded_for delete
acl CONNECT method CONNECT
acl safe_ports port 80 443
acl tls_ports port 443
# BIGO's rotating public HLS CDN has returned HTTPS ports 1454, 1457,
# 1458 and 1462. Bound the exception to the surrounding 20-port band.
# Only CONNECT to this DNS suffix is eligible; nonpublic IPs remain denied.
acl bigo_media_port port 1450-1469
acl bigo_media_host dstdomain -n .cubetecn.com
acl local_names dstdomain -n .localhost .local .lan .internal .home .home.arpa .onion
# Deny local, reserved, multicast, link-local, shared, and private destinations.
acl nonpublic dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001::/23 2001:db8::/32 2002::/16 3fff::/20 fc00::/7 fe80::/10 fec0::/10 ff00::/8
http_access deny !safe_ports !bigo_media_port
http_access deny CONNECT !tls_ports !bigo_media_port
http_access deny bigo_media_port !CONNECT
http_access deny bigo_media_port !bigo_media_host
http_access deny local_names
http_access deny nonpublic
http_access allow all
pinger_enable off
shutdown_lifetime 2 seconds
