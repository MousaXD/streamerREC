# No caching, no external proxy listener, no arbitrary ports or destinations.
http_port 3128
visible_hostname streamrec-egress
pid_filename none
cache deny all
cache_mem 8 MB
cache_store_log none
logfile_rotate 0
logformat egress %ts %rm %>rd %Ss/%>Hs
access_log stdio:/dev/stdout egress
cache_log /dev/stderr
strip_query_terms on
forwarded_for delete
acl CONNECT method CONNECT
acl safe_ports port 80 443
acl tls_ports port 443
acl allowed_hosts dstdomain -n "/etc/squid/egress-domains.txt"
# Deny local, reserved, multicast, link-local, shared, and private destinations.
acl nonpublic dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::1/128 64:ff9b::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
http_access deny !safe_ports
http_access deny CONNECT !tls_ports
http_access deny !allowed_hosts
http_access deny nonpublic
http_access allow allowed_hosts
http_access deny all
pinger_enable off
shutdown_lifetime 2 seconds
