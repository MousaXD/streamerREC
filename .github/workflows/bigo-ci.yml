name: BIGO integration

on:
  push:
    branches:
      - fix/native-bigo-support-2026-09-10
    paths:
      - "main.py"
      - "bigo.py"
      - "bigo_recorder.py"
      - "requirements.txt"
      - "Dockerfile"
      - "tests/test_bigo*.py"
      - ".github/workflows/bigo-ci.yml"
  pull_request:
    paths:
      - "main.py"
      - "bigo.py"
      - "bigo_recorder.py"
      - "requirements.txt"
      - "Dockerfile"
      - "tests/test_bigo*.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile main.py bigo.py bigo_recorder.py tests/test_bigo.py tests/test_bigo_recorder.py

      - name: BIGO unit tests
        run: python -m unittest discover -s tests -p "test_bigo*.py" -v

      - name: Docker build
        run: docker build -t streamerrec-bigo-audit .
