name: BIGO integration

on:
  push:
    branches:
      - fix/native-bigo-support-2026-09-10
    paths:
      - "main.py"
      - "bigo.py"
      - "bigo_recorder.py"
      - "requirements.txt"
      - "Dockerfile"
      - "tests/test_bigo*.py"
      - ".github/workflows/bigo-ci.yml"
  pull_request:
    paths:
      - "main.py"
      - "bigo.py"
      - "bigo_recorder.py"
      - "requirements.txt"
      - "Dockerfile"
      - "tests/test_bigo*.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile main.py bigo.py bigo_recorder.py tests/test_bigo.py tests/test_bigo_recorder.py

      - name: BIGO unit tests
        run: python -m unittest discover -s tests -p "test_bigo*.py" -v

      - name: Docker build
        run: docker build -t streamerrec-bigo-audit .

      - name: Container startup smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name streamerrec-bigo-smoke -p 127.0.0.1:18080:8080 streamerrec-bigo-audit
          cleanup() {
            docker logs streamerrec-bigo-smoke || true
            docker rm -f streamerrec-bigo-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy" >&2
          exit 1
